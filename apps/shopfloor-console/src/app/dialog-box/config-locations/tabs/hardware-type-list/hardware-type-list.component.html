<p class="summary" *ngIf="loaded && dataSource.data.length">{{ selectedHardware.size }} hardware model(s) available to this location</p>

<mat-tree [dataSource]="dataSource" [treeControl]="treeControl" class="hardware-tree">

  <!-- Parent node: config type -->
  <mat-nested-tree-node *matTreeNodeDef="let node; when: hasChild">
    <div class="mat-tree-node">
      <button mat-icon-button matTreeNodeToggle>
        <fa-icon [icon]="treeControl.isExpanded(node) ? faChevronDown : faChevronRight"></fa-icon>
      </button>

      <mat-checkbox
        [checked]="descendantAllSelected(node)"
        [indeterminate]="descendantPartiallySelected(node)"
        (change)="toggleNodeSelection(node)">
        {{ node.name }}
      </mat-checkbox>
    </div>

    <div [class.hardware-tree-invisible]="!treeControl.isExpanded(node)" role="group">
      <ng-container matTreeNodeOutlet></ng-container>
    </div>
  </mat-nested-tree-node>

  <!-- Leaf node: hardware model -->
  <mat-tree-node *matTreeNodeDef="let node" class="leaf-node">
    <div class="mat-tree-node leaf">
      <mat-checkbox
        [checked]="isSelected(node)"
        (change)="toggleLeafNode(node)">
        {{ node.name }}
      </mat-checkbox>
    </div>
  </mat-tree-node>

</mat-tree>

<p class="empty" *ngIf="loaded && !dataSource.data.length">No hardware models exist yet. Add them under Config &rarr; Hardware List.</p>
