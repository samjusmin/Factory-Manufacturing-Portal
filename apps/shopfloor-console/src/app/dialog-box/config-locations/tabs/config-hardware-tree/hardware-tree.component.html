<p class="empty" *ngIf="loaded && !dataSource.data.length">There are no hardware types yet. Add them under Config &rarr; Manage &rarr; Item Checklists.</p>

<mat-tree [dataSource]="dataSource" [treeControl]="treeControl" class="example-tree">

  <!-- Category nodes (with children) -->
  <mat-nested-tree-node *matTreeNodeDef="let node; when: hasChild" class="category-node">
    <div class="mat-tree-node">
      <!-- Expand/Collapse button using Font Awesome -->
      <button mat-icon-button matTreeNodeToggle [attr.aria-label]="'Show the types in ' + node.name">
        <fa-icon [icon]="treeControl.isExpanded(node) ? faChevronDown : faChevronRight"></fa-icon>
      </button>

      <!-- Checkbox for parent node -->
      <mat-checkbox
        [checked]="descendantAllSelected(node)"
        [indeterminate]="descendantPartiallySelected(node)"
        (change)="toggleNodeSelection(node)">
        {{ node.name }}
      </mat-checkbox>
    </div>

    <!-- Children container -->
    <div [class.example-tree-invisible]="!treeControl.isExpanded(node)" role="group">
      <ng-container matTreeNodeOutlet></ng-container>
    </div>
  </mat-nested-tree-node>

  <!-- Leaf nodes (no children) -->
  <mat-tree-node *matTreeNodeDef="let node" class="leaf-node">
    <div class="mat-tree-node leaf">
      <mat-checkbox
        [checked]="isSelected(node)"
        (change)="toggleLeafNode(node)">
        {{ node.name }}
      </mat-checkbox>
    </div>
  </mat-tree-node>

</mat-tree>
