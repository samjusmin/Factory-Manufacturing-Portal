<h2 mat-dialog-title>Change Location</h2>
<mat-dialog-content class="mat-typography">
    <p>Select the location to change to</p>

    <mat-form-field appearance="fill">
        <!--<mat-select [(value)]="selected">-->
        <mat-select placeholder="Location" [(value)]="selected">
            <mat-option *ngFor="let opt of optionList" [value]="opt">
                {{opt}}
            </mat-option>
        </mat-select>
    </mat-form-field>

</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="close()">Cancel</button>
  <button mat-button (click)="save()" cdkFocusInitial>Send</button>
</mat-dialog-actions>
