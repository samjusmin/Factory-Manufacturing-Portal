<div class="page-header">
    <button class="fat" type="button" aria-label="Back" title="Back" (click)="ConfigService.goBack()"><fa-icon [icon]="['fas', 'chevron-circle-left']"></fa-icon></button>
    <h1 class="fatHead">Hardware List</h1>
</div>

<div class="config-page" *ngIf="ConfigService.hardwareLoaded || ConfigService.loadError">
    <p class="subtitle intro">The hardware models a location can choose from when it adds a unit.</p>

    <webproject-list-filters storageKey="config-hardware-list-filters-open" [groups]="filterGroups" [selection]="selection" (selectionChange)="setSelection($event)">
        <mat-form-field listSearch class="search">
            <input matInput aria-label="Search hardware" (input)="applyFilter($event.target.value)" [placeholder]="hasFilters ? 'Search within filters' : 'Search hardware'">
        </mat-form-field>
        <div listActions class="toolbar-actions" *ngIf="ConfigService.isAdmin">
            <button type="button" class="btn-primary" (click)="addImage()">Add Hardware</button>
        </div>
    </webproject-list-filters>

    <div class="list-empty" *ngIf="ConfigService.loadError">
        The hardware list could not be loaded.
        <button type="button" class="btn-secondary retry" (click)="load()">Try again</button>
    </div>
    <p class="list-empty" *ngIf="!ConfigService.loadError && !ConfigService.hardwareList.data.length">There is no hardware yet.<ng-container *ngIf="ConfigService.isAdmin"> Use Add Hardware to create the first one.</ng-container></p>
    <p class="list-empty" *ngIf="ConfigService.hardwareList.data.length && !ConfigService.hardwareList.filteredData.length">No hardware matches<ng-container *ngIf="hasFilters"> these filters</ng-container><ng-container *ngIf="!hasFilters"> the search</ng-container>.
        <button type="button" class="link-btn small-link" *ngIf="hasFilters" (click)="clearFilters()">Clear filters</button>
    </p>

    <div class="table-list" [hidden]="!ConfigService.hardwareList.filteredData.length">
        <table mat-table matSort class="mat-elevation-z8 config-table" [dataSource]="ConfigService.hardwareList">
            <ng-container [matColumnDef]="column.id" *ngFor="let column of columnNames">
                <th mat-header-cell *matHeaderCellDef mat-sort-header [disabled]="column.id === 'isEdit'">{{ column.value }}</th>
                <td mat-cell *matCellDef="let element">
                    <ng-container *ngIf="!element.isEdit" [ngSwitch]="column.id">
                        <span *ngSwitchCase="'name'" class="cell-link">{{ element.name }}</span>
                        <ng-container *ngSwitchCase="'config_type'">
                            <span class="po-chip state-open type-chip" *ngFor="let type of element.config_type">{{ type }}</span>
                        </ng-container>
                        <button *ngSwitchCase="'isEdit'" type="button" class="icon-btn" aria-label="Edit hardware" title="Edit" [hidden]="!ConfigService.isAdmin" (click)="editRow(element)"><fa-icon [icon]="['fas', 'pencil-alt']"></fa-icon></button>
                    </ng-container>

                    <ng-container *ngIf="element.isEdit" [ngSwitch]="column.id">
                        <div *ngSwitchCase="'isEdit'" class="edit-actions">
                            <button type="button" class="icon-btn" aria-label="Save hardware" title="Save" (click)="saveChanges(element)"><fa-icon [icon]="['fas', 'check']"></fa-icon></button>
                            <button type="button" class="icon-btn danger" aria-label="Discard changes" title="Discard" (click)="cancelEntry(element)"><fa-icon [icon]="['fas', 'trash']"></fa-icon></button>
                        </div>
                        <mat-form-field *ngSwitchCase="'config_type'" class="table-field" floatLabel="never">
                            <mat-select placeholder="Config type" aria-label="Config type" required
                                [ngModel]="element.config_type[0]" (ngModelChange)="element.config_type = [$event]">
                                <mat-option *ngFor="let type of configTypes" [value]="type">{{ type }}</mat-option>
                            </mat-select>
                        </mat-form-field>
                        <mat-form-field *ngSwitchCase="'name'" class="table-field" floatLabel="never">
                            <input matInput placeholder="Name" aria-label="Name" required [(ngModel)]="element.name">
                        </mat-form-field>
                    </ng-container>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; let even = even; columns: displayedColumns" [ngClass]="{gray: even}"></tr>
        </table>
    </div>
</div>
