<h1 mat-dialog-title>{{ data.title }}</h1>
<mat-dialog-content class="mat-typography">
  <!--<h3>Develop across all platforms</h3>-->
  <p>{{ data.message }}
  </p>

</mat-dialog-content>
<mat-dialog-actions align="end">
  <button class="ok" mat-button [mat-dialog-close]="true" cdkFocusInitial>OK</button>
  <button class="cancel" mat-button [mat-dialog-close]="false" cdkFocusInitial>Cancel</button>
</mat-dialog-actions>
