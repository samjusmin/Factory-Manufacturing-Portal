<div class="page-header">
    <a class="back" routerLink="/login" aria-label="Back to login" title="Back to login">
        <fa-icon [icon]="['fas', 'chevron-circle-left']"></fa-icon>
    </a>
    <h1 class="fatHead">Reset Password</h1>
</div>

<div class="auth">
    <div class="auth-card">
        <p class="lead">Enter your email address and we will send you a new password.</p>

        <form [formGroup]="form" (ngSubmit)="sendEmail()" novalidate>
            <div class="field">
                <label for="email">Email address</label>
                <input id="email" type="email" formControlName="resetPass" class="field-input"
                    [class.invalid]="form.get('resetPass').touched && form.get('resetPass').invalid"
                    autocomplete="email" autofocus required />
                <p class="field-error" *ngIf="form.get('resetPass').touched && form.get('resetPass').invalid">Enter a valid email address</p>
            </div>

            <div class="actions">
                <a class="btn-secondary" routerLink="/login">Cancel</a>
                <button type="submit" class="btn-primary" [disabled]="form.invalid || sending">{{ sending ? 'Sending...' : 'Confirm' }}</button>
            </div>
        </form>
    </div>
</div>
